              {% set total_allowed = 24000 %}

              {% set monthly_allowed = 1000 %}

              {% set start_dt = strptime('2026-05-27', '%Y-%m-%d') %}

              {% set maturity_dt = strptime('2028-05-27', '%Y-%m-%d') %}

              {% set start_ts = as_timestamp(start_dt) %}

              {% set maturity_ts = as_timestamp(maturity_dt) %}

              {% set total_days = ((maturity_ts - start_ts) / 86400) %}

              {% set elapsed_days = ((as_timestamp(now()) - start_ts) / 86400)
              %}

              {% if elapsed_days < 0 %}{% set elapsed_days = 0 %}{% endif %}

              {% if elapsed_days > total_days %}{% set elapsed_days = total_days
              %}{% endif %}

              {% set daily_allowed = total_allowed / total_days %}

              {% set allowed_to_date = elapsed_days * daily_allowed %}

              {% set to_date_balance = allowed_to_date - used %}

              {% set completed_months = ((now().year - 2026) * 12 + (now().month
              - 5)) %}

              {% if now().day < 27 %}{% set completed_months = completed_months
              - 1 %}{% endif %}

              {% if completed_months < 0 %}{% set completed_months = 0 %}{%
              endif %}

              {% if completed_months > 24 %}{% set completed_months = 24 %}{%
              endif %}

              {% set current_cycle = completed_months + 1 %}

              {% if current_cycle > 24 %}{% set current_cycle = 24 %}{% endif %}

              {% set cycle_budget = current_cycle * monthly_allowed %}

              {% set mileage_bank = cycle_budget - used %}

              {% set remaining_total = total_allowed - used %}

              {% set pct = (used / total_allowed * 100) | round(1) %}

              {% set blocks = (pct / 5) | round(0, 'floor') | int %}

              {% if blocks < 0 %}{% set blocks = 0 %}{% endif %}

              {% if blocks > 20 %}{% set blocks = 20 %}{% endif %}

              {% if mileage_bank >= 300 and to_date_balance >= 0 %}
