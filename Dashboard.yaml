                start a lighting cycle.
              card_mod:
                style: |
                  ha-card {
                    border-radius: 24px;
                    border: 1px solid rgba(244, 67, 54, 0.65);
                    background: linear-gradient(135deg, rgba(244, 67, 54, 0.16), rgba(127, 127, 127, 0.04));
                    box-shadow: 0 3px 14px rgba(0, 0, 0, 0.12);
                  }
          - type: conditional
            conditions:
              - entity: input_boolean.garage_lighting_manual_off_override
                state: 'on'
            card:
              type: markdown
              content: >
                ## ✋ Manual pause is active

                The lights were switched off manually while a configured garage
                opening was still open. Motion cannot relight them until all
                configured openings close, or **Resume Automatic Control** is
                pressed.
              card_mod:
                style: |
                  ha-card {
                    border-radius: 24px;
                    border: 1px solid rgba(255, 152, 0, 0.65);
                    background: linear-gradient(135deg, rgba(255, 152, 0, 0.18), rgba(127, 127, 127, 0.04));
                    box-shadow: 0 3px 14px rgba(0, 0, 0, 0.12);
                  }
      - type: grid
        column_span: 4
        cards:
          - type: markdown
            title: How the New Logic Works
            content: >
              ## ⚙️ A cycle, not a pile of triggers

              **1. Start** — Opening the configured garage gate or entry door
              starts the lights only when the low-light rule **or** the schedule
              rule is active. A manual ON command always starts a cycle.

              **2. Stay on** — Once the cycle starts, enabled motion sensors
              keep the light on without checking brightness or schedule again.

              **3. Automatic off** — When all effective motion clears, the
              no-motion countdown starts. A new motion event cancels it.

              **4. Smart retrigger** — After an automatic OFF, motion remains
              armed for the configured post-off window. It also remains armed as
              long as a configured gate or door stays open. Motion during either
              condition relights the garage immediately.

              **5. Sleep** — With the lights off, both configured openings
              closed, and the post-off window finished, motion sensors go back
              to sleep. Random motion can no longer start the garage lights.

              **6. Workbench pairing** — When enabled, the Workbench mirrors the
              garage light for automatic and manual commands. When disabled, it
              remains independent and Node-RED leaves it alone.

              **7. Manual OFF** — A manual OFF ends the current cycle. If a
              configured opening is still open, a temporary pause prevents the
              sensors from immediately undoing your command.
            card_mod:
              style: |
                ha-card {
                  border-radius: 24px;
                  border: 1px solid rgba(127, 127, 127, 0.18);
                  box-shadow: 0 3px 14px rgba(0, 0, 0, 0.10);
                  padding: 4px 8px;
                }
