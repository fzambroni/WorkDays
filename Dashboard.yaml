                  # 🚦 Priority Console


                  {% set ns = namespace(items=[]) %}

                  {% if is_state('lock.aqara_smart_lock_u400', 'unlocked') %}
                    {% set ns.items = ns.items + ['🔓 Front door is unlocked'] %}
                  {% endif %}

                  {% if
                  is_state('binary_sensor.contact_sensor_front_door_intrusion',
                  'on') %}
                    {% set ns.items = ns.items + ['🚪 Front door contact is open'] %}
                  {% endif %}

                  {% set garage_state = states('cover.garage_gate') %} {% if
                  garage_state in ['open', 'opening', 'closing'] %}
                    {% set ns.items = ns.items + ['🏠 Garage gate is ' ~ garage_state] %}
                  {% endif %}

                  {% if is_state('binary_sensor.eero_wan_status', 'off') %}
                    {% set ns.items = ns.items + ['📡 Internet/WAN appears offline'] %}
                  {% endif %}


                  {% if not is_state('switch.sonoff_10017ff9be_1', 'on') %}
                    {% set ns.items = ns.items + ['⚡ Primary infrastructure switch is not ON'] %}
                  {% endif %}


                  {% if not
                  is_state('switch.master_home_assistant_sonoff_10018b459c',
                  'on') %}
                    {% set ns.items = ns.items + ['🧠 Home Assistant master power is not ON'] %}
                  {% endif %}


                  {% if not is_state('switch.master_water', 'on') %}
                    {% set ns.items = ns.items + ['💧 Master water control is not ON'] %}
                  {% endif %}


                  {% if is_state('lock.2026_genesis_gv70_door_lock', 'unlocked')
                  %}
                    {% set ns.items = ns.items + ['🚙 GV70 is unlocked'] %}
                  {% endif %}

                  {% if is_state('lock.2026_corolla_le_2026_corolla_le',
                  'unlocked') %}
                    {% set ns.items = ns.items + ['🚗 Corolla is unlocked'] %}
                  {% endif %}

                  {% if states('sensor.smtp_gmail_com_mail_usps_packages') |
                  int(0) > 0 %}
                    {% set ns.items = ns.items + ['📦 USPS packages expected: ' ~ states('sensor.smtp_gmail_com_mail_usps_packages')]
                  %} {% endif %}

                  {% if states('sensor.unavailable_entities_count') | int(0) > 0
                  %}
                    {% set ns.items = ns.items + ['🧩 Unavailable entities: ' ~ states('sensor.unavailable_entities_count')] %}
                  {% endif %}


                  {# Battery alerts: percentage sensors at 30% or below, plus
                  active low-battery binary sensors #} {% set battery =
                  namespace(low=0, critical=0) %}

                  {% for s in states.sensor %}
                    {% set unit = s.attributes.get('unit_of_measurement', '') %}
                    {% set device_class = s.attributes.get('device_class', '') %}
                    {% set is_battery = device_class == 'battery'
                      or ('battery' in s.entity_id and unit == '%') %}
                    {% set value = s.state | float(-1) %}
                    {% if is_battery and value >= 0 and value <= 30 %}
                      {% set battery.low = battery.low + 1 %}
                      {% if value <= 15 %}
                        {% set battery.critical = battery.critical + 1 %}
                      {% endif %}
                    {% endif %}
                  {% endfor %}

                  {% set battery_alerts = namespace(active=[]) %}

                  {% for s in states.binary_sensor %}
                    {% set device_class = s.attributes.get('device_class', '') %}
                    {% if (device_class == 'battery' or 'battery' in s.entity_id)
                      and s.state == 'on' %}
                      {% set battery_alerts.active = battery_alerts.active + [s] %}
                    {% endif %}
                  {% endfor %}

                  {% set battery_total = battery.low + (battery_alerts.active |
                  count) %}

                  {% if battery_total > 0 %}
                    {% if battery.critical > 0 %}
                      {% set ns.items = ns.items + ['🪫 Battery attention: ' ~ battery_total ~ ' device(s), including ' ~ battery.critical
                  ~ ' critical'] %}
                    {% else %}
                      {% set ns.items = ns.items + ['🔋 Battery attention: ' ~ battery_total ~ ' device(s) at 30% or with a low-battery
                  alert'] %}
                    {% endif %}
                  {% endif %}


                  {% if ns.items | count == 0 %}

                  ✅ No active priority alerts right now.

                  {% else %}

                  {% for item in ns.items %}

                  - {{ item }}

                  {% endfor %}

                  {% endif %}
