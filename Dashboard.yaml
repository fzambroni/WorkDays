      - type: grid
        cards:
          - type: heading
            heading: How it thinks
            heading_style: title
            icon: mdi:information-outline
            card_mod:
              style: |
                ha-card {
                  background: transparent;
                  border: none;
                  box-shadow: none;
                  padding: 4px 2px 0 2px;
                }
          - type: markdown
            title: Smart Bathroom Ventilation Help
            content: >
              This panel controls the automatic ventilation logic for the master
              bathroom.


              ### Main Control


              **Auto Ventilation**  

              Enables or disables the automatic bathroom ventilation routine.  

              When disabled, the fan will not turn on automatically, but you can
              still control it manually.


              ### Humidity Detection


              **Humidity Difference Threshold**  

              Turns the ventilation on when the bathroom humidity is higher than
              the kitchen/reference humidity by this amount.  

              Example: if set to `10%`, the fan turns on when the bathroom is at
              least 10% more humid than the kitchen.


              **High Humidity Threshold**  

              Turns the ventilation on when the bathroom humidity reaches this
              absolute value, even if the kitchen humidity is also high.


              **Hysteresis**  

              Prevents the fan from turning on and off too quickly.  

              The fan will only turn off after humidity drops below the
              configured threshold minus this value.


              ### Rapid Humidity Rise


              **Rapid Rise Detection**  

              Turns on the ventilation when humidity rises quickly, helping
              detect a shower earlier.


              **Rapid Rise Threshold**  

              Defines how much humidity must increase within the selected time
              window to trigger the fan.


              **Rapid Rise Window**  

              Defines how many minutes are used to calculate whether humidity is
              rising quickly.


              ### Runtime Protection


              **Minimum Runtime**  

              Once the fan turns on automatically, it will stay on for at least
              this amount of time.


              **Maximum Runtime**  

              Limits how long the fan can run continuously.


              **Cooldown**  

              Defines how long the system must wait after turning the fan off
              before it can automatically turn on again.


              ### Manual Override


              **Manual Hold Time**  

              If someone turns the fan off manually, the automation pauses for
              this amount of time before trying to turn it on again.


              ### Night Mode


              **Night Mode**  

              Uses separate nighttime limits to reduce noise and unnecessary
              runtime.


              **Night Start / Night End**  

              Defines the time window used for night mode.


              **Night Maximum Runtime**  

              Limits how long the fan can run during night mode.


              **Night Cooldown**  

              Defines the cooldown period used during night mode.


              ### Notifications


              **Notifications**  

              Creates an alert if the bathroom remains too humid after the fan
              has already run for the maximum allowed time.


              **Still High Alert Time**  

              Defines how long humidity must remain high after max runtime
              before an alert is created.


              ### Status


              **Ventilation Status**  

              Shows the current reason behind the automation decision, such as
              cooldown, high humidity, rapid rise, manual hold, or idle.
