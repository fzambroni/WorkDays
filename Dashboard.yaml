      - type: markdown
        content: >
          ## Help


          **Mode Sync Enabled**  

          Keeps active thermostats synchronized in Heat or Cool mode.


          **Individual Off**  

          A thermostat can be turned Off without turning the others Off.


          **Preserve Individual Off Zones**  

          When enabled, dashboard Heat/Cool commands only affect thermostats
          that are already active. Off zones stay Off. When disabled, dashboard
          Heat/Cool commands wake all thermostats.


          **Smart Away**  

          When Fabricio and Lucas are both away, the system waits for the
          configured delay, saves the current mode and temperature for each
          thermostat, locks the memory by turning Smart Away Active on, then
          applies the Away temperature to active thermostats.


          **Smart Away Restore Memory**  

          Use this card to confirm the original comfort temperature was saved
          correctly. If the thermostats were at 76°F before Away, the saved
          temperatures should remain 76°F while the thermostats are set to 78°F.


          **Restore On Return**  

          When either resident returns home, the automation restores each saved
          mode and target temperature explicitly. It also sends the temperature
          command twice with a short delay to help thermostats that are slow to
          accept updates.


          **Guest Mode**  

          Use this when visitors are home. It blocks Smart Away. If Smart Away
          is already active, enabling Guest Mode restores the saved comfort
          settings.


          **Presence Simulation Test**  

          Use this to test Smart Away without leaving the house. Turn Test Mode
          on, set both simulated people to Away, wait for the Away delay, then
          simulate one person Home to test restore.


          **Important:** while Test Mode is on, the HVAC Coordinator ignores the
          real person entities and uses the simulated Fabricio/Lucas states
          instead. Disable Test Mode when testing is complete.


          **Startup Sync Policy**  

          Defines how active thermostat modes are reconciled after Home
          Assistant starts.
