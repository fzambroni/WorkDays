              {% if ns.unavailable | count > 0 %}


              ## Unavailable or unknown


              | Device | State | Area | Updated |

              |:---|:---:|:---|:---|

              {% for item in ns.unavailable | sort(attribute='name') -%}

              | **{{ item.name }}**<br>`{{ item.entity }}` | ⚠️ {{ item.state }}
              | {{ area_name(item.entity) or '—' }} | {{
