              - type: markdown
                title: Help
                content: >
                  **Enable Auto-Lock Routine**  

                  Turns the smart auto-lock logic on or off. Turn this off when
                  you intentionally want the front door to stay unlocked.


                  **Lock on Home Assistant Startup**  

                  Locks the door after Home Assistant restarts, but only if the
                  door sensor says the door is closed.


                  **Relock If Unlocked but Not Opened**  

                  If the door is unlocked and nobody opens it, the door will
                  lock again after this delay.


                  **Lock Delay After Door Closes**  

                  After the door is opened and closed, the system waits this
                  long before locking. This prevents the lock from engaging
                  immediately while people are still going in and out.



                  **Live Countdown**  

                  Starts immediately after the lock changes to unlocked. If the
                  door is not opened, it counts down using **Relock If Unlocked
                  but Not Opened**. If the door opens, the countdown pauses and
                  waits for the door to close. Once closed, it restarts using
                  **Lock Delay After Door Closes** or the shorter night delay
                  when Night Quick-Lock is active.


                  **Alerts**  

                  Sends a phone notification to Fabricio and/or Lucas if the
                  door remains unlocked longer than the configured delay.


                  **Repeat Alerts**  

                  Keeps reminding enabled phones while the door remains
                  unlocked.


                  **Night Quick-Lock**  

                  Uses a shorter lock delay during the configured night window.
