          - type: markdown
            title: Irrigation Help
            content: >

              ## How this panel works


              **Manual Watering**  

              Choose a zone, choose a duration, then tap **Start**. The duration
              is sent directly to Rain Bird as a manual run command.


              **Quick Start**  

              The 5/10/15/20/30 minute buttons update the duration and
              immediately start the currently selected zone.


              **Stop**  

              Stops the currently selected zone. If another zone is running,
              select that zone first and tap **Stop**.


              **Weather Delay**  

              Use this when you want to pause scheduled irrigation for a
              specific number of days. Set the number, then tap **Apply**.
              **Clear** sets the delay back to 0.


              **Forecast Delay**  

              This enables Rain Bird's automatic forecast-based delay. In this
              dashboard it uses a practical default: 70% rain probability, 0.25
              in rainfall threshold, and 1 delay day.


              **Programs**  

              Program A/B/C are controlled in Rain Bird. This dashboard monitors
              their status and shows the Program A calendar when available.


              **Diagnostics**  

              Use Refresh when the app and Home Assistant look out of sync.
              Avoid pressing it repeatedly because the integration rate-limits
              refresh calls.
