              {% set remaining_days = total_days - elapsed_days %}

              {% if remaining_days < 1 %}{% set remaining_days = 1 %}{% endif %}

              {% set avg_day = used / elapsed_days %}

              {% set projected_total = avg_day * total_days %}

              {% set projected_balance = total_allowed - projected_total %}

