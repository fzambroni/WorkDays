      - type: markdown
        title: HVAC Overview
        content: >
          # 🌬️ HVAC Coordinator


          This panel is focused on coordination, not temperature control. It
          checks whether active thermostats agree on the same house mode and
          protects the comfort setpoints used before Smart Away.


          | Control | State |

          |---|---|

          | Mode sync | {{ states('input_boolean.hvac_mode_sync_enabled') }} |

          | Active house mode | {{ states('sensor.hvac_active_house_mode') }} |

          | Active thermostats | {{
          states('sensor.hvac_active_thermostat_count') }} |

          | Smart Away enabled | {{
          states('input_boolean.hvac_smart_away_enabled') }} |

          | Smart Away active | {{
          states('input_boolean.hvac_smart_away_active') }} |

          | Restore on return | {{
          states('input_boolean.hvac_restore_on_return') }} |
        grid_options:
          columns: 12
          rows: auto
        card_mod:
          style: |
            ha-card {
              border-radius: 28px;
              border: 1px solid rgba(127, 127, 127, 0.18);
              background: linear-gradient(135deg, rgba(127, 127, 127, 0.10), rgba(127, 127, 127, 0.03));
              box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
              padding: 6px 10px;
              overflow: hidden;
            }
            ha-card h1 {
              font-size: 1.45rem;
              line-height: 1.2;
              margin-bottom: 0.55rem;
            }
            ha-card h2 {
              font-size: 1.08rem;
              opacity: 0.9;
            }
            ha-card table {
              width: 100%;
              border-collapse: collapse;
            }
            ha-card th {
              text-align: left;
              opacity: 0.72;
              font-weight: 600;
            }
            ha-card td, ha-card th {
              padding: 7px 4px;
              border-bottom: 1px solid rgba(127, 127, 127, 0.16);
            }
            ha-card tr:last-child td {
              border-bottom: none;
            }
            ha-card code {
              background: rgba(127, 127, 127, 0.14);
              border-radius: 8px;
              padding: 1px 6px;
            }
      - square: false
        type: grid
        cards:
