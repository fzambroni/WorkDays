              Home Assistant reconnects. Transitions involving `unknown` or
              `unavailable` are ignored.


              **Away arming:** when the second resident crosses from `home` to
              any away state, Node-RED confirms that both Fabricio and Lucas are
              still away. If Guest Mode is OFF, it requests Alarmo Away.


              **Return disarming:** when either resident crosses from an away
              state to `home`, Node-RED requests Disarm for both Alarmo and
              Blink. Guest Mode does not block this safety disarm.


              **Guest / Manual Mode:** blocks only automatic Away arming caused
              by location. Manual controls, door-unlock disarming, and return
              disarming continue to work.


              **Alarmo → Blink synchronization:** Alarmo Home or Away arms
              Blink. Alarmo Disarmed disarms Blink. Manually changing Blink
              never changes Alarmo.


              **Front door:** a real transition of the Aqara lock to `unlocked`
              requests Disarm for both systems.


              **Phone notification recipients:** the Fabricio and Lucas switches
              work independently. Before each mobile notification, Node-RED
              checks the corresponding switch. A disabled recipient is skipped
              while all other alarm functions continue normally.


              **History:** Node-RED records Alarmo, Blink, Guest Mode, and the
              two notification-recipient switches. Commands issued by the
              combined controls use the selected operator name. When Alarmo
              triggers, the flow first uses Alarmo's reported sensor and then
              the active-sensor helper as a fallback.


              **Future expansion:** keypad, NFC, remote, or new sensor flows
              should set `msg.action_source` and connect to the appropriate
              command link in the **Security Alarm** Node-RED tab.
