          - type: markdown
            title: Battery Monitor Help
            content: >
              # ℹ️ Battery Monitor Guide


              This view automatically finds percentage-based battery sensors and
              low-battery binary sensors. New compatible devices should appear
              without editing the dashboard.


              **Recommended thresholds**


              - 🔴 **0–15%:** replace disposable batteries or charge the device
              now.

              - 🟠 **16–30%:** keep a replacement ready and schedule the change.

              - 🟡 **31–50%:** monitor; outdoor and high-use devices can fall
              faster.

              - 🟢 **Above 50%:** normally healthy.


              **Practical notes**


              - A lock, alarm sensor, leak detector, or exterior sensor deserves
              earlier replacement than a noncritical device.

              - Battery percentages are estimates. Some devices remain high for
              weeks and then drop quickly.

              - “Last update” helps identify stale integrations. A device that
              has not updated for an unusually long time may be offline rather
              than fully charged.

              - For phones, vehicles, and rechargeable devices, “replace”
              usually means **charge or inspect**, not replace the battery.

              - Tap a header badge to open the entity details and history.
