              style: |
                ha-card {
                  background: transparent;
                  border: none;
                  box-shadow: none;
                  padding: 4px 2px 0 2px;
                }
          - type: markdown
            content: >
              {% set temp_on =
              states('input_number.porch_fan_temperature_threshold') | float(0)
              %}

              {% set temp_drop =
              states('input_number.porch_fan_temperature_hysteresis') | float(0)
              %}

              {% set humidity_on =
              states('input_number.porch_fan_humidity_threshold') | float(0) %}

              {% set humidity_drop =
              states('input_number.porch_fan_humidity_hysteresis') | float(0) %}

              {% set cooldown =
              states('input_number.porch_fan_cooldown_minutes') | int(10) %}


              ## Porch Fan Controls


              ### Automatic Climate Control


              **Enable Automatic Control** is the master switch for sensor-based
              operation.  

              **Use Temperature** and **Use Humidity** independently select
              which sensors participate.


              The fan turns on when **either enabled trigger** reaches its start
              point:


              - Temperature ON: **{{ temp_on | round(0) }}°F**

              - Humidity ON: **{{ humidity_on | round(0) }}%**

              - Automatic speed: **{{
              states('input_number.porch_fan_auto_speed') }}%**


              The drop controls create separate OFF points:


              - Temperature OFF: **{{ (temp_on - temp_drop) | round(0) }}°F or
              below**

              - Humidity OFF: **{{ (humidity_on - humidity_drop) | round(0) }}%
              or below**


              When both triggers are enabled, **either one may start the fan**,
              but

              **both must clear their OFF points before it stops**. This
              hysteresis

              prevents small sensor fluctuations from causing rapid cycling.


              ### Automatic Restart Cooldown


              After an automatic climate stop, the fan remains off for

              **{{ cooldown }} minute{{ '' if cooldown == 1 else 's' }}**, even
              if

              temperature or humidity rises again. The sensors continue to be

              monitored, but automatic restart is blocked until **Cooldown

              Remaining** finishes. This reduces repetitive cycling and gives
              the

              fan motor time to cool.


              Changing the cooldown slider affects the **next** cooldown. A
              countdown

              already running keeps the duration with which it started. Manually

              turning the fan on cancels or bypasses cooldown.


              ### Manual Control


              Manually turning on the fan or changing its speed activates
              **Manual

              Hold** and pauses climate decisions. **Auto-Off After Manual
              Start**

              controls how long that manual run lasts; set it to `0` for no
              manual

              timer. Press **Resume Automatic Control** to end Manual Hold
              immediately.


              ### Quiet Hours


              **Enable Quiet Hours** creates a daily forced-off window between

              **Force Off At** and **Resume Automatic Control At**. Quiet Hours
              have

              the highest priority and can turn off a manually operated fan.


              ### Priority


              **Quiet Hours → Manual Hold → Automatic Climate Control → Cooldown

              restart protection.**
            card_mod:
              style: |
                ha-card {
