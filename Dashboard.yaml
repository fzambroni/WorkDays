    sections:
      - type: grid
        column_span: 4
        cards:
          - type: markdown
            title: Irrigation Center
            content: >

              # 🌿 Irrigation Center


              {% set active = states('sensor.rain_bird_active_zone') %}

              {% set delay = states('sensor.carnes_crossroads_rain_delay') |
              int(0) %}

              {% set connected =
              is_state('binary_sensor.carnes_crossroads_connected', 'on') %}

              {% set forecast =
              states('binary_sensor.carnes_crossroads_forecast_rain_delay') %}

              {% set alarms =
              states('sensor.carnes_crossroads_rain_bird_iq4_alarms') | int(0)
              %}

              {% set warnings =
              states('sensor.carnes_crossroads_rain_bird_iq4_warnings') | int(0)
              %}


              {% if not connected %}

              🔴 **Controller offline** — check Wi-Fi, controller power, or Rain
              Bird cloud access.

              {% elif alarms > 0 %}

              🔴 **Needs attention** — {{ alarms }} active alarm(s).

              {% elif warnings > 0 %}

              🟠 **Warning** — {{ warnings }} warning(s) reported.

              {% elif active != 'None' %}

              🔵 **Watering now** — {{ active }}.

              {% elif delay > 0 %}

              🌧️ **Weather delay active** — scheduled watering is paused for {{
              delay }} day(s).

              {% else %}

              🟢 **Ready** — no active irrigation or delay detected.

              {% endif %}


              | Signal | Current |

              |---|---:|

              | Connection | **{{
              states('binary_sensor.carnes_crossroads_connected') }}** |

              | Controller mode | **{{
              states('sensor.carnes_crossroads_controller_mode') }}** |

              | Active zone | **{{ active }}** |

              | Running zones | **{{
              states('sensor.rain_bird_running_zone_count') }}** |

              | Rain delay | **{{ delay }} day(s)** |

              | Forecast delay | **{{ forecast }}** |

              | Programs scheduled | **{{
              states('sensor.rain_bird_scheduled_program_count') }}** |

              | Last action | **{{
              states('input_text.rainbird_last_dashboard_action') }}** |
            grid_options:
              columns: 12
              rows: auto
            card_mod:
              style: >
                ha-card {
                  border-radius: 28px;
                  border: 1px solid rgba(127, 127, 127, 0.18);
                  background: linear-gradient(135deg, rgba(127, 127, 127, 0.10), rgba(127, 127, 127, 0.03));
                  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
                  padding: 6px 10px;
                  overflow: hidden;
                }

                ha-card h1 { font-size: 1.45rem; line-height: 1.2;
