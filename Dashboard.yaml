              - type: markdown
                title: Garage Gate Control & Monitor Help
                content: >
                  **Garage Gate Control**  

                  `cover.garage_gate` is the unified control. It shows Open,
                  Closed, Opening, or Closing and sends only one protected pulse
                  while waiting for the physical contact sensor to catch up.


                  **Apple CarPlay**  

                  In the Home Assistant iPhone app, open **Companion App
                  Settings → CarPlay → Quick Access** and add
                  `cover.garage_gate`.


                  **iPhone Widget**  

                  Create a Home Assistant Custom Widget with `cover.garage_gate`
                  for status. For a single tap action, choose **Run script** and
                  select `script.garage_gate_toggle`.


                  **Closing Warning Beep**  

                  When enabled, `nspanel-garage` and the garage fingerprint
                  buzzer play the same selected warning together before
                  `cover.garage_gate` sends the close command. When disabled,
                  the gate closes immediately.


                  **Warning Duration**  

                  Defines how many seconds both warning buzzers sound before
                  closing. Opening cancels any pending countdown immediately.


                  **Test Both Warning Buzzers**  

                  Plays two synchronized cycles without moving the gate.


                  **Monitor Enabled**  

                  Enables or disables the entire garage gate monitoring routine.


                  **Alert When Someone Leaves Home**  

                  Sends a priority notification if Fabricio or Lucas leaves Home
                  while the garage gate is open.


                  **Alert When Gate Is Left Open**  

                  Sends a priority notification if the garage gate remains open
                  longer than the configured delay.


                  **Left Open Alert Delay**  

                  Number of minutes the garage gate can stay open before the
                  first alert is sent.


                  **Repeat Alerts Until Closed**  

                  Keeps sending reminders while the garage gate remains open.


                  **Repeat Alert Interval**  

                  Number of minutes between repeated reminders.


                  **Notify Fabricio / Notify Lucas**  

                  Controls who receives garage gate alerts.
