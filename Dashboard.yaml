          Keeps all active thermostats using the same HVAC mode.


          Supported modes: **Heat**, **Cool**, and **Off**.


          Individual **Off** is allowed. Each thermostat keeps its own
          independent target temperature.


          Smart Away now saves the comfort temperature only once per away cycle
          and locks that memory while **Smart Away Active** is on. This prevents
          GPS/zone changes from overwriting the original temperature with the
          Away temperature.
