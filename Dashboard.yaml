              - type: markdown
                content: >
                  ## Front Porch Presence Light Help


                  **Enable Presence Light**  

                  Turns this presence-only routine on or off.


                  **Start Offset from Sunset**  

                  Defines when the front porch motion sensor starts being
                  allowed to turn on the light.


                  Use a negative value to start before sunset:

                  - `-30` = sensor starts working 30 minutes before sunset


                  Use a positive value to start after sunset:

                  - `30` = sensor starts working 30 minutes after sunset


                  Use `0` to start exactly at sunset.


                  **Stop Offset from Sunrise**  

                  Defines the maximum time the automation will continue
                  detecting motion in the morning.


                  Use a negative value to stop before sunrise:

                  - `-30` = sensor stops working 30 minutes before sunrise


                  Use a positive value to stop after sunrise:

                  - `30` = sensor stops working 30 minutes after sunrise


                  Use `0` to stop exactly at sunrise.


                  **Light Duration After Motion**  

                  Defines how long the front porch light stays on after motion
                  is detected.


                  **Presence Window Active**  

                  Shows whether the automation is currently inside the active
                  motion window calculated from sunset and sunrise.


                  **Current Window Start / End**  

                  Shows the calculated start and end time for the current active
                  window.


                  **Motion Status**  

                  Shows the current presence state and when it last changed.


                  ### Behavior


                  - The light only turns on from the presence sensor.

                  - Motion only works inside the sunset-to-sunrise window.

                  - The start of the window is configurable relative to sunset.

                  - The end of the window is configurable relative to sunrise.

                  - Each new motion event restarts the light timer.

                  - When the timer expires, the front porch light turns off
                  automatically.
