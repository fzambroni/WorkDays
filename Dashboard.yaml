            card_mod:
              style: |
                ha-card {
                  background: transparent;
                  border: none;
                  box-shadow: none;
                  padding: 4px 2px 0 2px;
                }
          - type: markdown
            title: 📋 Battery Inventory
            content: >-
              {% set ns = namespace(items=[], other=[]) %}


              {% for s in states %}
                {% set entity_id = s.entity_id %}
                {% set entity_lower = entity_id | lower %}
                {% set name = s.name | default(entity_id, true) %}
                {% set name_lower = name | lower %}
                {% set unit = s.attributes.get('unit_of_measurement', '') %}
                {% set device_class = s.attributes.get('device_class', '') %}

                {% set is_battery =
                  device_class == 'battery'
                  or 'battery' in entity_lower
                  or 'battery' in name_lower
                %}

                {% set is_percentage_battery =
                  is_battery
                  and is_number(s.state)
                  and (s.state | float(0)) >= 0
                  and (s.state | float(0)) <= 100
                  and (
                    unit == '%'
                    or device_class == 'battery'
                    or 'battery_level' in entity_lower
                    or 'battery_percentage' in entity_lower
                  )
                %}

                {% if is_percentage_battery %}
                  {% set ns.items = ns.items + [{
                    'value': s.state | float(0),
                    'entity': entity_id,
                    'name': name,
                    'updated': s.last_updated
                  }] %}
                {% elif is_battery %}
                  {% set ns.other = ns.other + [{
                    'entity': entity_id,
                    'name': name,
                    'state': s.state,
                    'unit': unit
                  }] %}
                {% endif %}
              {% endfor %}


              {% if ns.items | count == 0 %}

              No percentage-based battery sensors were found.

              {% else %}

              | Status | Device | Level | Area | Updated |

              |:---|:---|---:|:---|:---|

              {% for item in ns.items | sort(attribute='value') -%}

              {% if item.value <= 15 -%}
                {% set status = '🔴 Critical' -%}
              {% elif item.value <= 30 -%}
                {% set status = '🟠 Low' -%}
              {% elif item.value <= 50 -%}
