            heading: Battery Action Center
            heading_style: title
            icon: mdi:battery-alert-variant-outline
            card_mod:
              style: |
                ha-card {
                  background: transparent;
                  border: none;
                  box-shadow: none;
                  padding: 4px 2px 0 2px;
                }
          - type: markdown
            title: Battery Priorities
            content: >-
              # 🔋 Battery Action Center


              {% set ns = namespace(
                items=[],
                critical=0,
                low=0,
                watch=0,
                healthy=0,
                unknown=0,
                alerts=[]
              ) %}


              {# Percentage-based battery entities #}

              {% for s in states %}
                {% set entity_id = s.entity_id %}
                {% set entity_lower = entity_id | lower %}
                {% set name = s.name | default(entity_id, true) %}
                {% set name_lower = name | lower %}
                {% set unit = s.attributes.get('unit_of_measurement', '') %}
                {% set device_class = s.attributes.get('device_class', '') %}

                {% set is_battery =
                  device_class == 'battery'
                  or 'battery' in entity_lower
                  or 'battery' in name_lower
                %}

                {% set is_percentage_battery =
                  is_battery
                  and is_number(s.state)
                  and (s.state | float(0)) >= 0
                  and (s.state | float(0)) <= 100
                  and (
                    unit == '%'
                    or device_class == 'battery'
                    or 'battery_level' in entity_lower
                    or 'battery_percentage' in entity_lower
                  )
                %}

                {% if is_percentage_battery %}
                  {% set value = s.state | float(0) %}

                  {% set ns.items = ns.items + [{
                    'value': value,
                    'entity': entity_id,
                    'name': name,
                    'updated': s.last_updated
                  }] %}

                  {% if value <= 15 %}
                    {% set ns.critical = ns.critical + 1 %}
                  {% elif value <= 30 %}
                    {% set ns.low = ns.low + 1 %}
                  {% elif value <= 50 %}
                    {% set ns.watch = ns.watch + 1 %}
                  {% else %}
                    {% set ns.healthy = ns.healthy + 1 %}
                  {% endif %}

                {% elif is_battery and s.domain == 'sensor' %}
                  {% set ns.unknown = ns.unknown + 1 %}
                {% endif %}
              {% endfor %}


              {# Active binary low-battery alerts #}

              {% for s in states.binary_sensor %}
                {% set entity_lower = s.entity_id | lower %}
                {% set name_lower = s.name | default('', true) | lower %}
                {% set device_class = s.attributes.get('device_class', '') %}

                {% set is_battery_alert =
                  device_class == 'battery'
                  or 'battery' in entity_lower
                  or 'battery' in name_lower
                %}

                {% if is_battery_alert and s.state == 'on' %}
                  {% set ns.alerts = ns.alerts + [{
                    'entity': s.entity_id,
                    'name': s.name | default(s.entity_id, true),
                    'updated': s.last_updated
                  }] %}
                {% endif %}
              {% endfor %}


              | Priority | Devices | Recommended action |

              |:---|---:|:---|

              | 🔴 Critical · 0–15% | **{{ ns.critical }}** | Replace or charge
              now |

              | 🟠 Low · 16–30% | **{{ ns.low }}** | Plan replacement soon |

              | 🟡 Monitor · 31–50% | **{{ ns.watch }}** | Keep an eye on it |

              | 🟢 Healthy · 51–100% | **{{ ns.healthy }}** | No action needed |

              | ⚠️ Active battery alerts | **{{ ns.alerts | count }}** | Inspect
              the device |

              | ❔ No percentage available | **{{ ns.unknown }}** | Check
              integration or device |


              {% set action_items = ns.items
                | selectattr('value', 'le', 30)
                | list
              %}


              {% if action_items | count == 0 and ns.alerts | count == 0 %}


              ✅ **No batteries currently need replacement or charging.**


              {% else %}


              ## Devices requiring attention


              | Device | Level | Area | Last update |

              |:---|---:|:---|:---|

              {% for item in action_items | sort(attribute='value') -%}

              | **{{ item.name }}**<br>`{{ item.entity }}` | **{{ item.value |
              round(0) | int }}%** | {{ area_name(item.entity) or '—' }} | {{
              relative_time(item.updated) }} ago |

              {% endfor -%}

              {% for item in ns.alerts | sort(attribute='name') -%}

              | **{{ item.name }}**<br>`{{ item.entity }}` | **Low-battery
              alert** | {{ area_name(item.entity) or '—' }} | {{
              relative_time(item.updated) }} ago |

              {% endfor %}


              {% endif %}
            grid_options:
              columns: 12
              rows: auto
            card_mod:
              style: |
                ha-card {
                  border-radius: 28px;
                  border: 1px solid rgba(127, 127, 127, 0.18);
                  background: linear-gradient(
                    135deg,
                    rgba(127, 127, 127, 0.10),
                    rgba(127, 127, 127, 0.03)
                  );
                  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
                  padding: 6px 10px;
                  overflow: hidden;
                }

                ha-card h1 {
                  font-size: 1.45rem;
                  line-height: 1.2;
                  margin-bottom: 0.55rem;
                }

                ha-card h2 {
                  font-size: 1.08rem;
                  opacity: 0.9;
                }

                ha-card table {
                  width: 100%;
                  border-collapse: collapse;
                }

                ha-card th {
                  text-align: left;
                  opacity: 0.72;
                  font-weight: 600;
                }

                ha-card td,
