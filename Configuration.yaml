            {% set keywords = ['outdoor', 'backyard', 'porch', 'weather', 'forecast', 'freezer', 'refrigerator', 'fridge', 'cpu', 'processor', 'blink'] %}
            {% set ns = namespace(count=0) %}
            {% for s in states.sensor | selectattr('attributes.device_class', 'eq', 'humidity') %}
              {% set label = (s.entity_id ~ ' ' ~ s.name) | lower %}
              {% set match = namespace(value=false) %}
              {% for keyword in keywords %}{% if keyword in label %}{% set match.value = true %}{% endif %}{% endfor %}
              {% if is_number(s.state) and s.entity_id not in excluded and (include_external or not match.value) %}
                {% set ns.count = ns.count + 1 %}
              {% endif %}
            {% endfor %}
            {{ ns.count }}
          temperature_range: >-
            {{ states('input_number.environment_monitor_temperature_minimum') }}–{{ states('input_number.environment_monitor_temperature_maximum') }} °F
          humidity_range: >-
            {{ states('input_number.environment_monitor_humidity_minimum') }}–{{ states('input_number.environment_monitor_humidity_maximum') }} %

