        state: >-
          {% set temp_min = states('input_number.environment_monitor_temperature_minimum') | float(60) %}
          {% set temp_max = states('input_number.environment_monitor_temperature_maximum') | float(80) %}
          {% set humidity_min = states('input_number.environment_monitor_humidity_minimum') | float(30) %}
          {% set humidity_max = states('input_number.environment_monitor_humidity_maximum') | float(60) %}
          {% set excluded_text = states('input_text.environment_monitor_excluded_entities') %}
          {% set excluded = (excluded_text | replace(' ', '')).split(',')
             if excluded_text not in ['unknown', 'unavailable', 'none', ''] else [] %}
          {% set include_external = is_state('input_boolean.environment_monitor_include_external_sensors', 'on') %}
          {% set automatic_keywords = [
            'outdoor', 'backyard', 'porch', 'weather', 'forecast',
            'freezer', 'refrigerator', 'fridge', 'cpu', 'processor', 'blink'
          ] %}
          {% set ns = namespace(alerts=0, temperatures=0, humidities=0, monitored=0) %}
          {% for s in states.sensor %}
            {% set device_class = s.attributes.device_class | default('', true) %}
            {% if device_class in ['temperature', 'humidity'] and is_number(s.state) %}
              {% set label = (s.entity_id ~ ' ' ~ s.name) | lower %}
              {% set keyword_match = namespace(value=false) %}
              {% for keyword in automatic_keywords %}
                {% if keyword in label %}
                  {% set keyword_match.value = true %}
                {% endif %}
              {% endfor %}
              {% set excluded_by_policy = (not include_external) and keyword_match.value %}
              {% set excluded_manually = s.entity_id in excluded %}
              {% if not excluded_by_policy and not excluded_manually %}
                {% set ns.monitored = ns.monitored + 1 %}
                {% if device_class == 'temperature' %}
                  {% set ns.temperatures = ns.temperatures + 1 %}
                  {% if s.state | float < temp_min or s.state | float > temp_max %}
                    {% set ns.alerts = ns.alerts + 1 %}
                  {% endif %}
                {% else %}
                  {% set ns.humidities = ns.humidities + 1 %}
                  {% if s.state | float < humidity_min or s.state | float > humidity_max %}
                    {% set ns.alerts = ns.alerts + 1 %}
                  {% endif %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.alerts }}
