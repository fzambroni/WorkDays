  ###########################################################################
  # Routine: Smart Garage Gate Cover
  # Converts the momentary pulse switch plus delayed contact sensor into a
  # single cover entity for dashboards, CarPlay, iOS widgets, and automations.
  ###########################################################################

  - cover:
      - name: "Garage Gate"
        unique_id: smart_garage_gate_cover
        device_class: garage
        availability: >-
          {{ states('switch.garage_gate') not in ['unknown', 'unavailable']
             and states('binary_sensor.garage_contact_sensor_garage_gate_intrusion')
               not in ['unknown', 'unavailable'] }}
        state: >-
          {% set motion = states('input_select.garage_gate_motion_state') %}
          {% set warning = is_state('script.garage_gate_close_with_warning', 'on') %}
          {% if warning %}
            closing
          {% elif motion == 'opening' %}
            opening
          {% elif motion == 'closing' %}
            closing
          {% elif is_state('binary_sensor.garage_contact_sensor_garage_gate_intrusion', 'on') %}
            open
          {% elif is_state('binary_sensor.garage_contact_sensor_garage_gate_intrusion', 'off') %}
            closed
          {% else %}
            {{ none }}
          {% endif %}
        icon: >-
          {% set state = states('cover.garage_gate') %}
          {% if state == 'opening' %}
            mdi:garage-open-variant
          {% elif state == 'closing' %}
            mdi:garage-alert-variant
          {% elif state == 'open' %}
            mdi:garage-open
          {% else %}
            mdi:garage
          {% endif %}
        open_cover:
          # Cancel a pending warning/close sequence before opening. This avoids
          # a delayed close pulse after someone changes their mind.
          - action: script.turn_off
            target:
              entity_id: script.garage_gate_close_with_warning
          - action: script.garage_gate_warning_stop
          - action: script.garage_gate_command
            data:
              command: open
        close_cover:
          # The package runs both buzzers together and sends only one protected
          # close command after the configurable warning period.
          - action: script.garage_gate_close_with_warning

