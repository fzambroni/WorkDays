###############################################################################
# Home Assistant Main Configuration
# Organized by platform/integration first, then helper domains grouped by routine.
###############################################################################

# Loads the default set of integrations. Do not remove.
default_config:

homeassistant:
  # Packages are loaded from /config/packages
  packages: !include_dir_named packages

###############################################################################
# System / Core Integrations
###############################################################################

recorder:
  purge_keep_days: 20

api:

# Text to speech
tts:
  - platform: google_translate

# External YAML includes
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
sensor: !include sensors.yaml

shell_command:
  outlook_calendar_upload: '/config/scripts/outlook_calendar_upload.sh "{{ operation }}" "{{ filename }}" "{{ chunk }}"'

###############################################################################
# Frontend / Lovelace
###############################################################################

frontend:
  extra_module_url:
    - /local/community/lovelace-card-mod/card-mod.js
    - /local/community/custom-brand-icons/custom-brand-icons.js
  themes: !include_dir_merge_named themes

###############################################################################
# Notifications
###############################################################################

notify:
  - name: WhatsApp
    platform: rest
    resource: https://api.callmebot.com/whatsapp.php
    data:
      source: HA
      phone: +13513530362
      apikey: 3992692

###############################################################################
# Bluetooth / BLE
###############################################################################

ble_monitor:
  active_scan: true
  bt_auto_restart: true

###############################################################################
# MQTT
###############################################################################

mqtt:
  sensor:
    - state_topic: "home/bedroom/temperature"


