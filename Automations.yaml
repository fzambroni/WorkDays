- id: water_leak_fridge_alert_and_containment
  alias: Water Leak - Alert and Containment
  description: Monitors the Fridge, Laundry, Kitchen Sink, and Filtration Center leak
    sensors. A new dry-to-wet transition can send independently configurable critical
    mobile alerts and can optionally close the master water valve. The valve is not
    repeatedly forced closed while a sensor remains wet, so it can be reopened manually
    during an active leak. Dashboard test buttons never move the valve.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.zb_water_sensor_fridge_water_leak
    - binary_sensor.zb_water_sensor_laundry_water_leak
    - binary_sensor.zb_water_sensor_kitchen_sink_water_leak
    - binary_sensor.zb_water_sensor_filtration_center_water_leak
    from: 'off'
    to: 'on'
    id: leak
  - trigger: state
    entity_id: input_button.water_leak_fridge_test_alert
    id: test_fridge
  - trigger: state
    entity_id: input_button.water_leak_laundry_test_alert
    id: test_laundry
  - trigger: state
    entity_id: input_button.water_leak_kitchen_sink_test_alert
    id: test_kitchen_sink
  - trigger: state
    entity_id: input_button.water_leak_filtration_center_test_alert
    id: test_filtration_center
  conditions: []
  actions:
  - variables:
      is_test: '{{ trigger.id != ''leak'' }}'
      leak_location: "{{ {\n  'binary_sensor.zb_water_sensor_fridge_water_leak': 'Fridge',\n
        \ 'input_button.water_leak_fridge_test_alert': 'Fridge',\n  'binary_sensor.zb_water_sensor_laundry_water_leak':
        'Laundry',\n  'input_button.water_leak_laundry_test_alert': 'Laundry',\n  'binary_sensor.zb_water_sensor_kitchen_sink_water_leak':
        'Kitchen Sink',\n  'input_button.water_leak_kitchen_sink_test_alert': 'Kitchen
        Sink',\n  'binary_sensor.zb_water_sensor_filtration_center_water_leak': 'Filtration
        Center',\n  'input_button.water_leak_filtration_center_test_alert': 'Filtration
        Center'\n}.get(trigger.entity_id, trigger.entity_id) }}"
      auto_shutoff_enabled: '{{ is_state(''input_boolean.water_leak_fridge_auto_shutoff'',
        ''on'') }}'
      event_time: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
      notification_tag: '{{ ''water-leak-'' ~ (leak_location | lower | replace(''
        '', ''-'')) }}'
      alert_title: '{{ ''TEST - Water Leak: '' ~ leak_location if is_test else ''URGENT
        - Water Leak: '' ~ leak_location }}'
      alert_message: "{% if is_test %}\n  Test alert for the {{ leak_location }} water
        leak sensor. This test does\n  not change the master water valve.\n{% else
        %}\n  The {{ leak_location }} water leak sensor is WET. Check the\n  {{ leak_location
        }} area immediately.\n  {% if auto_shutoff_enabled %}\n    Automatic water
        shutoff is enabled. The master water valve is being closed.\n  {% else %}\n
        \   Automatic water shutoff is disabled. The master water valve has not been
        changed.\n  {% endif %}\n{% endif %}"
  - action: input_text.set_value
    target:
      entity_id: input_text.water_leak_fridge_last_event
    data:
      value: "{% if is_test %}\n  {{ event_time }} - Test alert: {{ leak_location
        }}\n{% elif auto_shutoff_enabled %}\n  {{ event_time }} - LEAK: {{ leak_location
        }} - Master water close requested\n{% else %}\n  {{ event_time }} - LEAK:
        {{ leak_location }} - Auto shutoff disabled\n{% endif %}"
  - if:
    - condition: template
      value_template: '{{ not is_test and auto_shutoff_enabled }}'
    then:
    - action: switch.turn_off
      target:
        entity_id: switch.master_water
  - parallel:
    - sequence:
      - condition: state
        entity_id: input_boolean.water_leak_fridge_notify_fabricio
        state: 'on'
      - action: notify.mobile_app_fabricio_zambroni_17
        data:
          title: '{{ alert_title }}'
          message: '{{ alert_message }}'
          data:
            tag: '{{ notification_tag }}'
            push:
              interruption-level: critical
              sound:
                name: default
                critical: 1
                volume: 1
    - sequence:
      - condition: state
        entity_id: input_boolean.water_leak_fridge_notify_lucas
        state: 'on'
      - action: notify.mobile_app_lucas_zambroni_new
        data:
          title: '{{ alert_title }}'
          message: '{{ alert_message }}'
          data:
            tag: '{{ notification_tag }}'
            push:
              interruption-level: critical
              sound:
                name: default
                critical: 1
                volume: 1
  mode: queued
  max: 10
  max_exceeded: warning
