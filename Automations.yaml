      'on') %}\n  {{ is_state('input_select.hvac_test_fabricio_presence', 'Home')\n
      \    or is_state('input_select.hvac_test_lucas_presence', 'Home') }}\n{% else
      %}\n  {{ is_state('person.fabricio_zambroni', 'home')\n     or is_state('person.lucas_zambroni',
      'home') }}\n{% endif %}\n"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ states(''input_select.hvac_restore_living_room_mode'')
          in [''heat'', ''cool''] }}'
      sequence:
      - service: climate.set_hvac_mode
        target:
          entity_id: climate.living_room_living_room_thermostat_t6_pro_thermostat
        data:
          hvac_mode: '{{ states(''input_select.hvac_restore_living_room_mode'') }}'
