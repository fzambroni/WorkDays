- id: '1780622631330'
  alias: Garage External - Night Schedule
  description: Liga o switch externo da garagem 1 hora antes do pôr do sol e desliga
    2 horas antes do nascer do sol. Se for ligado fora desse período, desliga após
    2 minutos.
  triggers:
  - event: sunset
    offset: -01:00:00
    id: turn_on
    trigger: sun
  - event: sunrise
    offset: -02:00:00
    id: turn_off
    trigger: sun
  - entity_id: switch.nspanel_garage_relay_2
    to: 'on'
    id: accidental_on
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: turn_on
      sequence:
      - target:
          entity_id: switch.nspanel_garage_relay_2
        action: switch.turn_on
    - conditions:
      - condition: trigger
        id: turn_off
      sequence:
      - target:
          entity_id: switch.nspanel_garage_relay_2
        action: switch.turn_off
    - conditions:
      - condition: trigger
        id: accidental_on
      - condition: sun
        after: sunrise
        after_offset: -02:00:00
      - condition: sun
        before: sunset
        before_offset: -01:00:00
      sequence:
      - delay:
          hours: 0
          minutes: 1
          seconds: 0
          milliseconds: 0
      - target:
          entity_id: switch.nspanel_garage_relay_2
        action: switch.turn_off
  mode: restart
- id: hvac_coordinator_sync_active_thermostat_mode
  alias: HVAC Coordinator - Sync Active Thermostat Mode
  mode: restart
  trigger:
  - platform: state
    entity_id:
    - climate.living_room_living_room_thermostat_t6_pro_thermostat
    - climate.bedroom_bedroom_thermostat_t6_pro_thermostat
    - climate.second_floor_thermostat_t6_pro_thermostat
  condition:
  - condition: state
    entity_id: input_boolean.hvac_mode_sync_enabled
    state: 'on'
  - condition: template
    value_template: '{{ trigger.to_state.state in [''heat'', ''cool''] }}

      '
  action:
  - variables:
      source_entity: '{{ trigger.entity_id }}'
      new_mode: '{{ trigger.to_state.state }}'
      thermostats:
      - climate.living_room_living_room_thermostat_t6_pro_thermostat
      - climate.bedroom_bedroom_thermostat_t6_pro_thermostat
      - climate.second_floor_thermostat_t6_pro_thermostat
  - repeat:
      for_each: '{{ thermostats }}'
      sequence:
      - condition: template
        value_template: "{{ repeat.item != source_entity\n   and states(repeat.item)
          not in ['off', 'unknown', 'unavailable', new_mode] }}\n"
      - service: climate.set_hvac_mode
        target:
          entity_id: '{{ repeat.item }}'
        data:
          hvac_mode: '{{ new_mode }}'
- id: hvac_coordinator_apply_house_mode_from_dashboard
  alias: HVAC Coordinator - Apply House Mode From Dashboard
  mode: restart
  trigger:
  - platform: state
    entity_id: input_select.hvac_house_mode
  condition:
  - condition: state
    entity_id: input_boolean.hvac_mode_sync_enabled
    state: 'on'
  - condition: template
    value_template: '{{ states(''input_select.hvac_house_mode'') in [''Heat'', ''Cool'',
      ''Off''] }}

      '
  action:
  - variables:
      selected_mode: '{{ states(''input_select.hvac_house_mode'') }}'
      selected_hvac_mode: "{{ 'heat' if selected_mode == 'Heat'\n   else 'cool' if
        selected_mode == 'Cool'\n   else 'off' }}\n"
      thermostats:
      - climate.living_room_living_room_thermostat_t6_pro_thermostat
      - climate.bedroom_bedroom_thermostat_t6_pro_thermostat
      - climate.second_floor_thermostat_t6_pro_thermostat
  - repeat:
      for_each: '{{ thermostats }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ selected_mode == ''Off'' }}'
          sequence:
          - service: climate.set_hvac_mode
            target:
              entity_id: '{{ repeat.item }}'
            data:
              hvac_mode: 'off'
        - conditions:
          - condition: template
            value_template: "{{ selected_mode in ['Heat', 'Cool']\n   and states(repeat.item)
              not in ['unknown', 'unavailable']\n   and (\n     is_state('input_boolean.hvac_preserve_individual_off_zones',
              'off')\n     or states(repeat.item) != 'off'\n   ) }}\n"
          sequence:
          - service: climate.set_hvac_mode
            target:
              entity_id: '{{ repeat.item }}'
            data:
              hvac_mode: '{{ selected_hvac_mode }}'
- id: hvac_coordinator_startup_mode_reconciliation
  alias: HVAC Coordinator - Startup Mode Reconciliation
  mode: single
  trigger:
  - platform: homeassistant
    event: start
  - platform: state
    entity_id: input_boolean.hvac_mode_sync_enabled
    to: 'on'
  condition:
  - condition: state
    entity_id: input_boolean.hvac_mode_sync_enabled
    state: 'on'
  - condition: template
    value_template: '{{ states(''input_select.hvac_startup_sync_policy'') != ''Do
      nothing'' }}

      '
  action:
  - delay:
      minutes: 1
  - variables:
      policy: '{{ states(''input_select.hvac_startup_sync_policy'') }}'
      thermostats:
      - climate.living_room_living_room_thermostat_t6_pro_thermostat
      - climate.bedroom_bedroom_thermostat_t6_pro_thermostat
      - climate.second_floor_thermostat_t6_pro_thermostat
      target_mode: "{% if policy == 'Force Heat' %}\n  heat\n{% elif policy == 'Force
        Cool' %}\n  cool\n{% else %}\n  {% set modes = [\n    states('climate.living_room_living_room_thermostat_t6_pro_thermostat'),\n
        \   states('climate.bedroom_bedroom_thermostat_t6_pro_thermostat'),\n    states('climate.second_floor_thermostat_t6_pro_thermostat')\n
        \ ] %}\n  {% set active = modes | reject('in', ['off', 'unknown', 'unavailable'])
        | list %}\n  {{ active[0] if active | count > 0 else 'none' }}\n{% endif %}\n"
  - condition: template
    value_template: '{{ target_mode in [''heat'', ''cool''] }}'
  - repeat:
      for_each: '{{ thermostats }}'
      sequence:
      - condition: template
        value_template: '{{ states(repeat.item) not in [''off'', ''unknown'', ''unavailable'',
          target_mode] }}

          '
      - service: climate.set_hvac_mode
        target:
          entity_id: '{{ repeat.item }}'
        data:
          hvac_mode: '{{ target_mode }}'
- id: hvac_coordinator_smart_away
  alias: HVAC Coordinator - Smart Away
  mode: single
  max_exceeded: silent
  trigger:
  - platform: state
    entity_id:
    - person.fabricio_zambroni
    - person.lucas_zambroni
    - input_select.hvac_test_fabricio_presence
    - input_select.hvac_test_lucas_presence
  - platform: event
    event_type: timer.finished
    event_data:
      entity_id: timer.hvac_arrival_comfort
  condition:
  - condition: state
    entity_id: input_boolean.hvac_smart_away_enabled
    state: 'on'
  - condition: state
    entity_id: input_boolean.hvac_guest_mode
    state: 'off'
  - condition: state
    entity_id: input_boolean.hvac_smart_away_active
    state: 'off'
  - condition: state
    entity_id: timer.hvac_arrival_comfort
    state: idle
  - condition: template
    value_template: '{{ is_state(''sensor.hvac_effective_occupancy'', ''Away'') }}'
  action:
  - delay:
      minutes: '{{ states(''input_number.hvac_away_delay_minutes'') | int(20) }}'
  - condition: state
    entity_id: input_boolean.hvac_smart_away_enabled
    state: 'on'
  - condition: state
    entity_id: input_boolean.hvac_guest_mode
    state: 'off'
  - condition: state
    entity_id: input_boolean.hvac_smart_away_active
    state: 'off'
  - condition: state
    entity_id: timer.hvac_arrival_comfort
    state: idle
  - condition: template
    value_template: '{{ is_state(''sensor.hvac_effective_occupancy'', ''Away'') }}'
  - service: input_select.select_option
    target:
      entity_id: input_select.hvac_restore_living_room_mode
    data:
      option: '{% set mode = states(''climate.living_room_living_room_thermostat_t6_pro_thermostat'')
        %} {{ mode if mode in [''heat'', ''cool'', ''off''] else ''unknown'' }}

        '
  - service: input_select.select_option
    target:
      entity_id: input_select.hvac_restore_bedroom_mode
    data:
      option: '{% set mode = states(''climate.bedroom_bedroom_thermostat_t6_pro_thermostat'')
        %} {{ mode if mode in [''heat'', ''cool'', ''off''] else ''unknown'' }}

        '
  - service: input_select.select_option
    target:
      entity_id: input_select.hvac_restore_second_floor_mode
    data:
      option: '{% set mode = states(''climate.second_floor_thermostat_t6_pro_thermostat'')
        %} {{ mode if mode in [''heat'', ''cool'', ''off''] else ''unknown'' }}

        '
  - service: input_number.set_value
    target:
      entity_id: input_number.hvac_restore_living_room_temperature
    data:
      value: "{{ state_attr('climate.living_room_living_room_thermostat_t6_pro_thermostat',
        'temperature')\n   | float(states('input_number.hvac_restore_living_room_temperature')
        | float(75)) }}\n"
  - service: input_number.set_value
    target:
      entity_id: input_number.hvac_restore_bedroom_temperature
    data:
      value: "{{ state_attr('climate.bedroom_bedroom_thermostat_t6_pro_thermostat',
        'temperature')\n   | float(states('input_number.hvac_restore_bedroom_temperature')
        | float(75)) }}\n"
  - service: input_number.set_value
    target:
      entity_id: input_number.hvac_restore_second_floor_temperature
    data:
      value: "{{ state_attr('climate.second_floor_thermostat_t6_pro_thermostat', 'temperature')\n
        \  | float(states('input_number.hvac_restore_second_floor_temperature') |
        float(75)) }}\n"
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.hvac_smart_away_active
  - repeat:
      for_each:
      - climate.living_room_living_room_thermostat_t6_pro_thermostat
      - climate.bedroom_bedroom_thermostat_t6_pro_thermostat
      - climate.second_floor_thermostat_t6_pro_thermostat
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ states(repeat.item) == ''cool'' }}'
          sequence:
          - service: climate.set_temperature
            target:
              entity_id: '{{ repeat.item }}'
            data:
              temperature: '{{ states(''input_number.hvac_away_cool_temperature'')
                | float(78) }}'
        - conditions:
          - condition: template
            value_template: '{{ states(repeat.item) == ''heat'' }}'
          sequence:
          - service: climate.set_temperature
            target:
              entity_id: '{{ repeat.item }}'
            data:
              temperature: '{{ states(''input_number.hvac_away_heat_temperature'')
                | float(62) }}'
- id: hvac_coordinator_restore_on_return
  alias: HVAC Coordinator - Restore On Return
  mode: restart
  trigger:
  - platform: state
    entity_id:
    - person.fabricio_zambroni
    - person.lucas_zambroni
    - input_select.hvac_test_fabricio_presence
    - input_select.hvac_test_lucas_presence
  condition:
  - condition: state
    entity_id: input_boolean.hvac_smart_away_active
    state: 'on'
  - condition: state
    entity_id: input_boolean.hvac_restore_on_return
    state: 'on'
  - condition: template
    value_template: "{% set test_trigger = trigger is defined and trigger.entity_id
      in [\n  'input_select.hvac_test_fabricio_presence',\n  'input_select.hvac_test_lucas_presence'\n]
      %} {% if test_trigger and not is_state('input_boolean.hvac_presence_test_mode_enabled',
      'on') %}\n  false\n{% elif is_state('input_boolean.hvac_presence_test_mode_enabled',
      'on') %}\n  {{ is_state('input_select.hvac_test_fabricio_presence', 'Home')\n
      \    or is_state('input_select.hvac_test_lucas_presence', 'Home') }}\n{% else
      %}\n  {{ is_state('person.fabricio_zambroni', 'home')\n     or is_state('person.lucas_zambroni',
      'home') }}\n{% endif %}\n"
  action:
  - delay:
      minutes: '{{ states(''input_number.hvac_return_restore_delay_minutes'') | int(2)
