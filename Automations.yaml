          entity_id: climate.bedroom_bedroom_thermostat_t6_pro_thermostat
        data:
          hvac_mode: '{{ states(''input_select.hvac_restore_bedroom_mode'') }}'
      - delay:
          seconds: 8
      - service: climate.set_temperature
        target:
          entity_id: climate.bedroom_bedroom_thermostat_t6_pro_thermostat
        data:
          temperature: '{{ states(''input_number.hvac_restore_bedroom_temperature'')
            | float(75) }}'
      - delay:
          seconds: 5
      - service: climate.set_temperature
        target:
          entity_id: climate.bedroom_bedroom_thermostat_t6_pro_thermostat
        data:
          temperature: '{{ states(''input_number.hvac_restore_bedroom_temperature'')
            | float(75) }}'
    - conditions:
      - condition: template
        value_template: '{{ states(''input_select.hvac_restore_bedroom_mode'') ==
          ''off'' }}'
      sequence:
      - service: climate.set_hvac_mode
        target:
          entity_id: climate.bedroom_bedroom_thermostat_t6_pro_thermostat
        data:
          hvac_mode: 'off'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ states(''input_select.hvac_restore_second_floor_mode'')
          in [''heat'', ''cool''] }}'
      sequence:
      - service: climate.set_hvac_mode
        target:
          entity_id: climate.second_floor_thermostat_t6_pro_thermostat
        data:
          hvac_mode: '{{ states(''input_select.hvac_restore_second_floor_mode'') }}'
      - delay:
          seconds: 8
      - service: climate.set_temperature
        target:
          entity_id: climate.second_floor_thermostat_t6_pro_thermostat
        data:
          temperature: '{{ states(''input_number.hvac_restore_second_floor_temperature'')
            | float(75) }}'
      - delay:
          seconds: 5
      - service: climate.set_temperature
        target:
          entity_id: climate.second_floor_thermostat_t6_pro_thermostat
        data:
          temperature: '{{ states(''input_number.hvac_restore_second_floor_temperature'')
            | float(75) }}'
    - conditions:
      - condition: template
        value_template: '{{ states(''input_select.hvac_restore_second_floor_mode'')
          == ''off'' }}'
      sequence:
      - service: climate.set_hvac_mode
        target:
          entity_id: climate.second_floor_thermostat_t6_pro_thermostat
        data:
          hvac_mode: 'off'
  - service: input_boolean.turn_off
    target:
      entity_id: input_boolean.hvac_smart_away_active
- id: hvac_coordinator_presence_test_buttons
  alias: HVAC Coordinator - Presence Test Buttons
  mode: restart
  trigger:
  - platform: state
    entity_id: input_button.hvac_test_start_new_away_cycle
    id: start_new_away_cycle
  - platform: state
    entity_id: input_button.hvac_test_simulate_both_away
    id: both_away
  - platform: state
    entity_id: input_button.hvac_test_simulate_both_home
    id: both_home
  - platform: state
    entity_id: input_button.hvac_test_simulate_fabricio_home
    id: fabricio_home
  - platform: state
    entity_id: input_button.hvac_test_simulate_lucas_home
    id: lucas_home
  - platform: state
    entity_id: input_button.hvac_test_disable_presence_simulation
    id: disable_simulation
  action:
  - choose:
    - conditions:
      - condition: trigger
        id: start_new_away_cycle
      sequence:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.hvac_presence_test_mode_enabled
      - service: input_select.select_option
        target:
          entity_id:
          - input_select.hvac_test_fabricio_presence
          - input_select.hvac_test_lucas_presence
        data:
          option: Home
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.hvac_smart_away_active
      - delay:
          seconds: 2
      - service: input_select.select_option
        target:
          entity_id:
          - input_select.hvac_test_fabricio_presence
          - input_select.hvac_test_lucas_presence
        data:
          option: Away
    - conditions:
      - condition: trigger
        id: both_away
      sequence:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.hvac_presence_test_mode_enabled
      - service: input_select.select_option
        target:
          entity_id:
          - input_select.hvac_test_fabricio_presence
          - input_select.hvac_test_lucas_presence
        data:
          option: Away
    - conditions:
      - condition: trigger
        id: both_home
      sequence:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.hvac_presence_test_mode_enabled
      - service: input_select.select_option
        target:
          entity_id:
          - input_select.hvac_test_fabricio_presence
          - input_select.hvac_test_lucas_presence
        data:
          option: Home
    - conditions:
      - condition: trigger
        id: fabricio_home
      sequence:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.hvac_presence_test_mode_enabled
      - service: input_select.select_option
        target:
          entity_id: input_select.hvac_test_fabricio_presence
        data:
          option: Home
      - service: input_select.select_option
        target:
          entity_id: input_select.hvac_test_lucas_presence
        data:
          option: Away
    - conditions:
      - condition: trigger
        id: lucas_home
      sequence:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.hvac_presence_test_mode_enabled
      - service: input_select.select_option
        target:
          entity_id: input_select.hvac_test_fabricio_presence
        data:
          option: Away
      - service: input_select.select_option
        target:
          entity_id: input_select.hvac_test_lucas_presence
        data:
          option: Home
    - conditions:
      - condition: trigger
        id: disable_simulation
      sequence:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.hvac_presence_test_mode_enabled
