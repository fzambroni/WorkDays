- id: hvac_coordinator_start_arrival_comfort
  alias: HVAC Coordinator - Start Arrival Comfort
  description: Treats the home as occupied for two hours. When Smart Away is active,
    restores the saved thermostat modes and temperatures before starting the temporary
    occupied-home override.
  mode: restart
  trigger:
  - platform: state
    entity_id: input_button.hvac_start_arrival_comfort
  condition: []
  action:
  - service: timer.start
    target:
      entity_id: timer.hvac_arrival_comfort
    data:
      duration: 02:00:00
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.hvac_smart_away_active
        state: 'on'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ states(''input_select.hvac_restore_living_room_mode'')
              in [''heat'', ''cool''] }}'
          sequence:
          - service: climate.set_hvac_mode
            target:
              entity_id: climate.living_room_living_room_thermostat_t6_pro_thermostat
            data:
              hvac_mode: '{{ states(''input_select.hvac_restore_living_room_mode'')
                }}'
          - delay:
              seconds: 8
          - service: climate.set_temperature
            target:
              entity_id: climate.living_room_living_room_thermostat_t6_pro_thermostat
            data:
              temperature: '{{ states(''input_number.hvac_restore_living_room_temperature'')
                | float(75) }}'
          - delay:
              seconds: 5
          - service: climate.set_temperature
            target:
              entity_id: climate.living_room_living_room_thermostat_t6_pro_thermostat
            data:
              temperature: '{{ states(''input_number.hvac_restore_living_room_temperature'')
                | float(75) }}'
        - conditions:
          - condition: template
            value_template: '{{ states(''input_select.hvac_restore_living_room_mode'')
              == ''off'' }}'
          sequence:
          - service: climate.set_hvac_mode
            target:
              entity_id: climate.living_room_living_room_thermostat_t6_pro_thermostat
            data:
              hvac_mode: 'off'
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ states(''input_select.hvac_restore_bedroom_mode'')
              in [''heat'', ''cool''] }}'
          sequence:
          - service: climate.set_hvac_mode
            target:
              entity_id: climate.bedroom_bedroom_thermostat_t6_pro_thermostat
            data:
              hvac_mode: '{{ states(''input_select.hvac_restore_bedroom_mode'') }}'
          - delay:
              seconds: 8
          - service: climate.set_temperature
            target:
              entity_id: climate.bedroom_bedroom_thermostat_t6_pro_thermostat
            data:
              temperature: '{{ states(''input_number.hvac_restore_bedroom_temperature'')
                | float(75) }}'
          - delay:
              seconds: 5
          - service: climate.set_temperature
            target:
              entity_id: climate.bedroom_bedroom_thermostat_t6_pro_thermostat
            data:
              temperature: '{{ states(''input_number.hvac_restore_bedroom_temperature'')
                | float(75) }}'
        - conditions:
          - condition: template
            value_template: '{{ states(''input_select.hvac_restore_bedroom_mode'')
              == ''off'' }}'
          sequence:
          - service: climate.set_hvac_mode
            target:
              entity_id: climate.bedroom_bedroom_thermostat_t6_pro_thermostat
            data:
              hvac_mode: 'off'
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ states(''input_select.hvac_restore_second_floor_mode'')
              in [''heat'', ''cool''] }}'
          sequence:
          - service: climate.set_hvac_mode
            target:
              entity_id: climate.second_floor_thermostat_t6_pro_thermostat
            data:
              hvac_mode: '{{ states(''input_select.hvac_restore_second_floor_mode'')
                }}'
          - delay:
              seconds: 8
          - service: climate.set_temperature
            target:
              entity_id: climate.second_floor_thermostat_t6_pro_thermostat
            data:
              temperature: '{{ states(''input_number.hvac_restore_second_floor_temperature'')
                | float(75) }}'
          - delay:
              seconds: 5
          - service: climate.set_temperature
            target:
              entity_id: climate.second_floor_thermostat_t6_pro_thermostat
            data:
              temperature: '{{ states(''input_number.hvac_restore_second_floor_temperature'')
                | float(75) }}'
        - conditions:
          - condition: template
            value_template: '{{ states(''input_select.hvac_restore_second_floor_mode'')
              == ''off'' }}'
          sequence:
          - service: climate.set_hvac_mode
            target:
              entity_id: climate.second_floor_thermostat_t6_pro_thermostat
            data:
              hvac_mode: 'off'
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.hvac_smart_away_active
  - service: persistent_notification.create
    data:
      notification_id: hvac_arrival_comfort
      title: Arrival Comfort started
      message: Home comfort mode is active for two hours. Smart Away is temporarily
        suspended and saved comfort settings have been restored.
- id: hvac_coordinator_cancel_arrival_comfort
  alias: HVAC Coordinator - Cancel Arrival Comfort
  description: Ends Arrival Comfort early, waits for the timer state to settle, and
    re-evaluates Smart Away using real or simulated presence without depending on
    a potentially stale template sensor.
  mode: single
  trigger:
  - platform: state
    entity_id: input_button.hvac_cancel_arrival_comfort
  condition: []
  action:
  - service: timer.cancel
    target:
      entity_id: timer.hvac_arrival_comfort
  - service: persistent_notification.dismiss
    data:
      notification_id: hvac_arrival_comfort
  - delay:
      seconds: 1
  - choose:
    - conditions:
      - condition: template
        value_template: "{% if is_state('input_boolean.hvac_presence_test_mode_enabled',
          'on') %}\n  {{ is_state('input_select.hvac_test_fabricio_presence', 'Away')\n
          \    and is_state('input_select.hvac_test_lucas_presence', 'Away') }}\n{%
          else %}\n  {{ not is_state('person.fabricio_zambroni', 'home')\n     and
          not is_state('person.lucas_zambroni', 'home') }}\n{% endif %}"
      - condition: state
        entity_id: input_boolean.hvac_smart_away_enabled
        state: 'on'
      - condition: state
        entity_id: input_boolean.hvac_guest_mode
        state: 'off'
      - condition: state
        entity_id: input_boolean.hvac_smart_away_active
        state: 'off'
      sequence:
      - service: automation.trigger
        target:
          entity_id: automation.hvac_coordinator_smart_away
        data:
          skip_condition: false
- id: hvac_coordinator_arrival_comfort_finished
  alias: HVAC Coordinator - Arrival Comfort Finished
  description: Dismisses the Arrival Comfort notification when the two-hour timer
    ends. The main Smart Away automation receives the same timer.finished event and
    resumes normal occupancy evaluation.
