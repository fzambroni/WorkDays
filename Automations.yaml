- id: rainbird_controller_offline_watch
  alias: Rain Bird - Controller Offline Watch
  description: Creates a persistent Home Assistant notification if the Rain Bird controller
    stays offline longer than the dashboard-configured delay.
  triggers:
  - trigger: state
    entity_id: binary_sensor.carnes_crossroads_connected
    to: 'off'
    for:
      minutes: '{{ states(''input_number.rainbird_offline_alert_delay_minutes'') |
        int(10) }}'
  conditions:
  - condition: state
    entity_id: input_boolean.rainbird_offline_alert_enabled
    state: 'on'
  actions:
  - action: persistent_notification.create
    data:
      notification_id: rainbird_controller_offline
      title: Rain Bird Controller Offline
      message: Rain Bird ESP-TM2 has been offline for more than {{ states('input_number.rainbird_offline_alert_delay_minutes')
        | int(10) }} minutes. Check Wi-Fi, controller power, Rain Bird cloud status,
        or the integration.
  - action: input_text.set_value
    target:
      entity_id: input_text.rainbird_last_dashboard_action
    data:
      value: Controller offline alert created by automation.
  mode: single
- id: rainbird_controller_back_online
  alias: Rain Bird - Controller Back Online
  description: Dismisses the Rain Bird offline notification when the controller reconnects.
  triggers:
  - trigger: state
    entity_id: binary_sensor.carnes_crossroads_connected
    to: 'on'
  conditions: []
  actions:
  - action: persistent_notification.dismiss
    data:
      notification_id: rainbird_controller_offline
  - action: input_text.set_value
    target:
      entity_id: input_text.rainbird_last_dashboard_action
    data:
      value: Controller came back online.
  mode: single
- id: rainbird_watering_state_logger
  alias: Rain Bird - Watering State Logger
  description: Stores a simple dashboard note when any Rain Bird zone changes state.
  triggers:
  - trigger: state
    entity_id:
    - sensor.carnes_crossroads_1_front_curb
    - sensor.carnes_crossroads_2_garage_side
    - sensor.carnes_crossroads_3_sides
    - sensor.carnes_crossroads_4_front
    - sensor.carnes_crossroads_5_backyard
    - sensor.carnes_crossroads_station_006
  conditions:
  - condition: template
    value_template: '{{ trigger.from_state is not none and trigger.to_state is not
      none and trigger.from_state.state != trigger.to_state.state }}'
  actions:
  - action: input_text.set_value
    target:
      entity_id: input_text.rainbird_last_zone_event
    data:
      value: '{{ trigger.to_state.name }} changed from {{ trigger.from_state.state
        }} to {{ trigger.to_state.state }}.'
  mode: queued
  max: 10
