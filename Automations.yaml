- id: '1787577711288'
  alias: System - Critical Entity Availability Monitor
  description: Report critical entities that remain unavailable or unknown.
  triggers:
  - trigger: state
    entity_id:
    - alarm_control_panel.carnes_crossroads
    - switch.master_water
    - binary_sensor.zb_water_sensor_laundry_water_leak
    - binary_sensor.zb_water_sensor_fridge_water_leak
    - binary_sensor.zb_water_sensor_kitchen_sink_water_leak
    - binary_sensor.zb_water_sensor_filtration_center_water_leak
    - binary_sensor.contact_sensor_front_door_intrusion
    - binary_sensor.backyard_porch_contact_sensor_backyard_door_intrusion
    - binary_sensor.garage_contact_sensor_garage_gate_intrusion
    - binary_sensor.garage_contact_sensor_garage_door_intrusion
    to: unavailable
    for: 00:05:00
    id: problem
  - trigger: state
    entity_id:
    - alarm_control_panel.carnes_crossroads
    - switch.master_water
    - binary_sensor.zb_water_sensor_laundry_water_leak
    - binary_sensor.zb_water_sensor_fridge_water_leak
    - binary_sensor.zb_water_sensor_kitchen_sink_water_leak
    - binary_sensor.zb_water_sensor_filtration_center_water_leak
    - binary_sensor.contact_sensor_front_door_intrusion
    - binary_sensor.backyard_porch_contact_sensor_backyard_door_intrusion
    - binary_sensor.garage_contact_sensor_garage_gate_intrusion
    - binary_sensor.garage_contact_sensor_garage_door_intrusion
    to: unknown
    for: 00:05:00
    id: problem
  - trigger: state
    entity_id:
    - alarm_control_panel.carnes_crossroads
    - switch.master_water
    - binary_sensor.zb_water_sensor_laundry_water_leak
    - binary_sensor.zb_water_sensor_fridge_water_leak
    - binary_sensor.zb_water_sensor_kitchen_sink_water_leak
    - binary_sensor.zb_water_sensor_filtration_center_water_leak
    - binary_sensor.contact_sensor_front_door_intrusion
    - binary_sensor.backyard_porch_contact_sensor_backyard_door_intrusion
    - binary_sensor.garage_contact_sensor_garage_gate_intrusion
    - binary_sensor.garage_contact_sensor_garage_door_intrusion
    from: unavailable
    id: recovered
  - trigger: state
    entity_id:
    - alarm_control_panel.carnes_crossroads
    - switch.master_water
    - binary_sensor.zb_water_sensor_laundry_water_leak
    - binary_sensor.zb_water_sensor_fridge_water_leak
    - binary_sensor.zb_water_sensor_kitchen_sink_water_leak
    - binary_sensor.zb_water_sensor_filtration_center_water_leak
    - binary_sensor.contact_sensor_front_door_intrusion
    - binary_sensor.backyard_porch_contact_sensor_backyard_door_intrusion
    - binary_sensor.garage_contact_sensor_garage_gate_intrusion
    - binary_sensor.garage_contact_sensor_garage_door_intrusion
    from: unknown
    id: recovered
  conditions:
  - condition: state
    entity_id: input_boolean.critical_entity_monitor_enabled
    state: 'on'
  actions:
  - variables:
      entity_name: '{{ trigger.to_state.name | default(trigger.entity_id, true) }}

        '
      notification_id: 'critical_entity_{{ trigger.entity_id | replace(''.'', ''_'')
        }}

        '
  - choose:
    - conditions:
      - condition: trigger
        id: problem
      sequence:
      - action: persistent_notification.create
        data:
          notification_id: '{{ notification_id }}'
          title: Critical Entity Unavailable
          message: '{{ entity_name }} has remained {{ trigger.to_state.state }} for
            more than five minutes.

            '
    - conditions:
      - condition: trigger
        id: recovered
      - condition: template
        value_template: '{{ trigger.to_state.state not in [''unknown'', ''unavailable'']
          }}

          '
      sequence:
      - action: persistent_notification.dismiss
        data:
          notification_id: '{{ notification_id }}'
  mode: parallel
  max: 10
- id: garage_co2_safety_alert_control
  alias: Garage CO2 Safety Alert - Control Outputs
  description: >-
    Controls the repeating garage warning, automatic gate ventilation, and
    SenseGuard siren from the garage CO2 reading. The dashboard enable and
    temporary inhibit controls override every automatic response.
  triggers:
  - trigger: state
    entity_id:
    - sensor.co2_sensor_garage_co2
    - input_boolean.garage_co2_alerts_enabled
    - input_boolean.garage_co2_alerts_inhibited
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - variables:
      co2_ppm: "{{ states('sensor.co2_sensor_garage_co2') | float(-1) }}"
      responses_allowed: >-
        {{ is_state('input_boolean.garage_co2_alerts_enabled', 'on')
           and is_state('input_boolean.garage_co2_alerts_inhibited', 'off') }}
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ not responses_allowed or co2_ppm < 0 }}"
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.zb_senseguard_siren_siren_on
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.garage_co2_gate_opened_automatically
    default:
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ co2_ppm > 2000 }}"
        sequence:
        - action: switch.turn_on
          target:
            entity_id: switch.zb_senseguard_siren_siren_on
      default:
      - action: switch.turn_off
        target:
          entity_id: switch.zb_senseguard_siren_siren_on
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ co2_ppm > 1500 }}"
        - condition: state
          entity_id: cover.garage_gate
          state: closed
        - condition: state
          entity_id: input_boolean.garage_co2_gate_opened_automatically
          state: 'off'
        sequence:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.garage_co2_gate_opened_automatically
        - action: cover.open_cover
          target:
            entity_id: cover.garage_gate
        - if:
          - condition: state
            entity_id: input_boolean.garage_co2_notify_fabricio
            state: 'on'
          then:
          - action: notify.mobile_app_fabricio_zambroni_17
            data:
              title: Garage CO2 Safety Alert
              message: >-
                The garage gate was opened automatically because garage CO2 is
                {{ co2_ppm | round(0) }} ppm, above the 1,500 ppm ventilation threshold.
        - if:
          - condition: state
            entity_id: input_boolean.garage_co2_notify_lucas
            state: 'on'
          then:
          - action: notify.mobile_app_lucas_zambroni_new
            data:
              title: Garage CO2 Safety Alert
              message: >-
                The garage gate was opened automatically because garage CO2 is
                {{ co2_ppm | round(0) }} ppm, above the 1,500 ppm ventilation threshold.
      - conditions:
        - condition: template
          value_template: "{{ co2_ppm <= 1500 }}"
        - condition: state
          entity_id: input_boolean.garage_co2_gate_opened_automatically
          state: 'on'
        sequence:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.garage_co2_gate_opened_automatically
    - if:
      - condition: template
        value_template: "{{ co2_ppm > 1000 }}"
      then:
      - repeat:
          while:
          - condition: numeric_state
            entity_id: sensor.co2_sensor_garage_co2
            above: 1000
          - condition: state
            entity_id: input_boolean.garage_co2_alerts_enabled
            state: 'on'
          - condition: state
            entity_id: input_boolean.garage_co2_alerts_inhibited
            state: 'off'
          sequence:
          - action: button.press
            target:
              entity_id: button.garage_fingerprint_play_garage_warning
          - delay: 00:00:05
  mode: restart
  max_exceeded: silent
