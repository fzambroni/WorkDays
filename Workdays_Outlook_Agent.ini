[Sync]
IntervalMinutes=15
PastDays=60
FutureDays=370
OutlookWinsOnConflict=1
DeleteInOutlookClearsWorkDays=0
SyncBlank=0
SyncWeekend=0
SyncTaggedBlankOrWeekend=1
RunAtWindowsStartup=0

[Outlook]
SubjectPrefix=WD-
CategoryPrefix=WD-
ReminderSet=0
ManagedOnly=0

[Markers]
ShowMarkerTagInSubject=1
MarkerSubjectSuffix= [Marker]
UseSeparateMarkerCategory=1
MarkerCategoryName=WorkDays - Marker
ReminderWhenMarkerExists=1
ReminderMinutesBeforeStart=540

[Safety]
EnableOutlookCleanup=1
CleanupPastYears=10
CleanupFutureYears=10
CleanupPrefixOnlyItems=0
PauseAfterOutlookCleanup=1
CleanupConfirmationPhrase=CLEAN WORKDAYS OUTLOOK

[Advanced]
LogLevel=Normal
